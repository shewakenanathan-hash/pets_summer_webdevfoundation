<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Pet - PawHaven</title><link rel="stylesheet" href="style.css"></head><body>
<nav><a class="logo" href="index.html">🐾 PawHaven</a><div class="navlinks"><a href="index.html">Home</a><a href="browse-pets.html">Browse Pets</a><a href="add-pet.html">Add Pet</a><a href="about.html">About</a></div></nav>
<main class="container"><form id="petForm" class="form"><h1>Add a Pet</h1><div id="formMessage"></div><div class="field"><label>Name</label><input name="petName" required></div><div class="field"><label>Animal Type</label><select name="animalType" required><option value="">Choose type</option><option>Dog</option><option>Cat</option><option>Rabbit</option><option>Bird</option></select></div><div class="field"><label>Breed</label><input name="breed" required></div><div class="field"><label>Description</label><textarea name="petDescription" required></textarea></div><div class="field"><label>Age</label><input name="petAge" type="number" min="0" required></div><div class="field"><label>Gender</label><select name="petGender" required><option value="">Choose gender</option><option>Male</option><option>Female</option></select></div><div class="field"><label>Image URL</label><input id="petImage" name="petImage" type="url" required></div><img id="imagePreview" class="preview" src="https://placehold.co/800x500?text=Pet" alt="Preview"><button class="btn btn-primary" type="submit">Add Pet</button></form></main><footer>PawHaven</footer><script src="js/add-pet.js"></script></body></html>
