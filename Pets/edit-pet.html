<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Pet - PawHaven</title><link rel="stylesheet" href="style.css"></head><body>
<nav><a class="logo" href="index.html">🐾 PawHaven</a><div class="navlinks"><a href="index.html">Home</a><a href="browse-pets.html">Browse Pets</a><a href="add-pet.html">Add Pet</a><a href="about.html">About</a></div></nav>
<main class="container"><form id="editForm" class="form"><h1>Edit Pet</h1><div id="editMessage"></div><div class="field"><label>Name</label><input name="petName" required></div><div class="field"><label>Animal Type</label><select name="animalType"><option>Dog</option><option>Cat</option><option>Rabbit</option><option>Bird</option></select></div><div class="field"><label>Breed</label><input name="breed" required></div><div class="field"><label>Description</label><textarea name="petDescription" required></textarea></div><div class="field"><label>Age</label><input name="petAge" type="number" min="0" required></div><div class="field"><label>Gender</label><select name="petGender"><option>Male</option><option>Female</option></select></div><div class="field"><label>Image URL</label><input name="petImage" type="url" required></div><div class="field"><label>Status</label><select name="status"><option>Available</option><option>Pending</option><option>Adopted</option></select></div><button class="btn btn-primary" type="submit">Save Changes</button> <button id="deletePet" class="btn btn-danger" type="button">Delete</button></form></main><footer>PawHaven</footer><script src="js/edit-pet.js"></script></body></html>
