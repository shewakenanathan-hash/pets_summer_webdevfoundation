<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse Pets</title>
  <link rel="stylesheet" href="./CSS/pawhaven.css">
</head>
<body data-page="browse">
  <header class="site-header">
    <div class="nav-container">
      <a class="logo" href="index.html"><span class="logo-icon">🐾</span>Pawhaven</a>
      <nav class="main-nav">
        <a class="nav-link active" href="browse pets.html">Browse pets</a>
        <a class="nav-link" href="edit pets.html">Edit pets</a>
        <a class="nav-link" href="add pets.html">Add pets</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="pets-section page-section">
      <div class="container">
        <div class="section-header">
          <h1>Browse pets</h1>
          <p>Find a loving companion who matches your family.</p>
        </div>

        <section class="filters">
          <div class="filter-group search-group">
            <label for="searchInput">Search</label>
            <input type="search" id="searchInput" placeholder="Search by name, breed, type...">
          </div>
          <div class="filter-group">
            <label for="animalFilter">Animal type</label>
            <select id="animalFilter">
              <option>All types</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="breedFilter">Breed</label>
            <select id="breedFilter">
              <option>All breeds</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="sortSelect">Sort</label>
            <select id="sortSelect">
              <option value="name">Name A-Z</option>
              <option value="age">Age youngest</option>
            </select>
          </div>
        </section>

        <section class="pets-grid" id="petsGrid">
        </section>

        <section class="state-message loading" id="loadingState">Loading pets...</section>
        <section class="state-message hidden" id="browseError"></section>
        <section class="state-message hidden" id="emptyState">
          <p>No pets match your search.</p>
        </section>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-brand">
          <div class="logo"><span class="logo-icon">🐾</span>Pawhaven</div>
          <p>Local pet care, adoption, and forever-home matching.</p>
        </div>
        <div class="footer-links">
          <a href="browse pets.html">Browse pets</a>
          <a href="edit pets.html">Edit pets</a>
          <a href="add pets.html">Add pets</a>
        </div>
      </div>
      <div class="copyright">© 2026 Pawhaven. Every friend deserves a home.</div>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/browse.js"></script>
</body>
</html>
