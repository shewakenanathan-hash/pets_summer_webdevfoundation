<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PawHaven | Add a Pet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar container">
      <a class="logo" href="index.html">Paw<span>Haven</span> 🐾</a>
      <button class="menu-button" id="menuButton" type="button">☰</button>
      <div class="nav-links" id="navLinks">
        <a href="index.html">Browse Pets</a>
        <a class="active" href="add-pet.html">Add a Pet</a>
      </div>
    </nav>
  </header>

  <main class="container section narrow">
    <a class="back-link" href="index.html">← Back to pets</a>
    <div class="page-title">
      <p class="eyebrow">Help a pet find a home</p>
      <h1>Add a new pet</h1>
      <p>Enter the pet's information below.</p>
    </div>

    <div id="formMessage" class="form-message hidden"></div>

    <form id="petForm" class="pet-form" novalidate>
      <div class="form-grid">
        <div class="form-group">
          <label for="name">Name *</label>
          <input id="name" name="name" type="text" placeholder="e.g. Luna">
          <small class="field-error" id="nameError"></small>
        </div>

        <div class="form-group">
          <label for="species">Species *</label>
          <select id="species" name="species">
            <option value="">Choose species</option>
            <option>Dog</option>
            <option>Cat</option>
            <option>Rabbit</option>
            <option>Bird</option>
            <option>Small Animal</option>
            <option>Other</option>
          </select>
          <small class="field-error" id="speciesError"></small>
        </div>

        <div class="form-group">
          <label for="breed">Breed</label>
          <input id="breed" name="breed" type="text" placeholder="e.g. Labrador">
        </div>

        <div class="form-group">
          <label for="age">Age in years *</label>
          <input id="age" name="age" type="number" min="0" step="1" placeholder="e.g. 2">
          <small class="field-error" id="ageError"></small>
        </div>

        <div class="form-group">
          <label for="gender">Gender</label>
          <select id="gender" name="gender">
            <option>Unknown</option>
            <option>Male</option>
            <option>Female</option>
          </select>
        </div>

        <div class="form-group">
          <label for="size">Size</label>
          <select id="size" name="size">
            <option>Medium</option>
            <option>Small</option>
            <option>Large</option>
          </select>
        </div>

        <div class="form-group full">
          <label for="imageUrl">Image URL *</label>
          <input id="imageUrl" name="imageUrl" type="url" placeholder="https://picsum.photos/seed/luna/640/480">
          <small class="field-error" id="imageUrlError"></small>
          <div class="image-preview-wrap">
            <img id="imagePreview" class="image-preview hidden" alt="Pet image preview">
          </div>
        </div>

        <div class="form-group full">
          <label for="description">Description *</label>
          <textarea id="description" name="description" rows="5" placeholder="Tell people about this pet..."></textarea>
          <small class="field-error" id="descriptionError"></small>
        </div>

        <div class="form-group">
          <label for="status">Status</label>
          <select id="status" name="status">
            <option>Available</option>
            <option>Pending</option>
            <option>Adopted</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <a class="button secondary" href="index.html">Cancel</a>
        <button id="submitButton" class="button primary" type="submit">Add Pet</button>
      </div>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">
      <strong>PawHaven 🐾</strong>
      <p>Every pet deserves a loving home.</p>
    </div>
  </footer>

  <script src="../js/config.js"></script>
  <script src="../js/add-pet.js"></script>
</body>
</html>
